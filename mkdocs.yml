site_name: TensorAeroSpace 
site_description: Open source deep learning framework for aerospace objects
repo_url: https://github.com/TensorAeroSpace/TensorAeroSpace
repo_name: TensorAeroSpace/TensorAeroSpace
docs_dir: docs

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      auto_caption: false
      caption_position: bottom
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: ["."]
          options:
            show_root_heading: true
            show_root_full_path: false
            merge_init_into_class: true
            members_order: source
            docstring_style: google
            heading_level: 2
            show_source: false
            extensions: []
  - autorefs:
      resolve_closest: true
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          default: true
          build: true
          nav:
            - Home: index.md
            - User Guide:
              - Installation: guide/installation.md
              - Unity Environment: guide/unity_env.md
              - TensorBoard Metrics: guide/metrics.md
              - 3D Flight Visualization: guide/3d-visualization.md
            - Aerospace Models:
              - F16:
                - Linear Longitudinal: model/f16.md
                - Nonlinear Longitudinal: model/f16_nonlinear_longitudinal.md
                - Nonlinear 6-DoF Angular: model/f16_nonlinear_angular.md
                - Aircraft Damage Modeling: model/aircraft-damage-modeling.md
              - B747: 
                - Classic State-Space: model/b747.md
                - Normalized State-Space: model/b747_imporove.md
              - EVL: model/evl.md
              - Typical Rocket: model/typical_rocket.md
              - ComSat: model/comsat.md
              - F4C: model/f4c.md
              - GeoSat: model/geosat.md
              - UAV: model/uav.md
              - X15:
                - Classic State-Space: model/x15.md
                - Normalized State-Space: model/x15_improved.md
              - LSU:
                - Classic State-Space: model/lsu.md
                - Normalized State-Space: model/lapan_improved.md
              - SUAV:
                - Classic State-Space: model/suav.md
                - Normalized State-Space: model/ultrastick_improved.md
              - ComSat Improved: model/comsat_improved.md
              - ELV Improved: model/elv_improved.md
              - F4C Improved: model/f4c_improved.md
              - Missile Improved: model/missile_improved.md
              - Unity Environment: model/unity_env.md
              
            - Agents:
              - PID: agent/pid.md
              - IHDP: agent/ihdp.md
              - IMGDHP: agent/imgdhp.md
              - ET-DHP: agent/et_dhp.md
              - AA-INDI: agent/aa_indi.md
              - iADP: agent/iadp.md
              - HDP: agent/hdp.md
              - ADHDP: agent/adhdp.md
              - MPC: agent/mpc.md
              - DQN: agent/dqn.md
              - A3C: agent/a3c.md
              - A2C-NARX: agent/a2c_narx.md
              - PPO: agent/ppo.md
              - SAC: agent/sac.md
              - DSAC: agent/dsac.md
              - DDPG: agent/ddpg.md
              - GAIL: agent/gail.md
              - Improved ComSat: agent/improved_comsat.md
              - Optimization: optimization/optuna_based.md
              - Benchmark:
                - Overview: benchmark/bench.md
                - Metrics: benchmark/metrics.md
                - ARM vs x64 Testing: benchmark/arm_testing.md
              - Comparison:
                - PPO vs PID (B747): comparison/ppo_vs_pid_b747.md
                - DSAC vs PID (B747): comparison/dsac_vs_pid_b747.md
                - DSAC vs PPO vs MPC vs PID (B747): comparison/all_vs_pid_b747.md
                - IHDP & IM-GDHP vs PID (Nonlinear F-16): comparison/ihdp_imgdhp_vs_pid_f16_nonlinear.md
              - Signals: signals/signals.md
            - Examples:
              - Environments: example/enviroment/gymnasium.md
              - IHDP:
                - Linear F16: example/agent/ihdp/example_ihdp.md
                - Walkthrough (step-by-step): example/agent/ihdp/example_ihdp_walkthrough.md
                - Nonlinear F16 (α-tracking): example/agent/ihdp/example_ihdp_nonlinear.md
              - IMGDHP (Nonlinear F16): example/agent/imgdhp/example_imgdhp_nonlinear.md
              - ET-DHP (Nonlinear F16): example/agent/et_dhp/example_etdhp_nonlinear.md
              - AA-INDI (Nonlinear F16): example/agent/aa_indi/example_aaindi_nonlinear.md
              - iADP (Nonlinear F16): example/agent/iadp/example_iadp_nonlinear.md
              - SAC F16: example/agent/sac/example-sac-f16.md
              - SAC B747: example/agent/sac/example-sac-b747.md
              - DSAC B747:
                - Training (Step Response): example/agent/dsac/example-dsac-b747.md
                - Training Script (Step Response): example/agent/dsac/train-dsac-b747-step-response.md
                - Training Script (Sine Tracking): example/agent/dsac/train-dsac-b747-tracking.md
                - Evaluation Notebook: example/agent/dsac/eval-dsac-b747.md
              - SAC Unity: example/agent/sac/example-sac-unity.md
              - Optimization: example/optimization/example_optimization.md
              - A2C-NARX: example/agent/a2c_narx/example-narx.md
              - MPC:
                - MPC + MLP (B747): example/agent/mpc/example-mpc-b747-torch-mpc-mlp.md
                - MPC + NARX (B747): example/agent/mpc/example-mpc-b747-torch-mpc-narx.md
                - MPC + Transformer (B747): example/agent/mpc/example-mpc-b747-torch-mpc-transformer.md
              - IHDP Failure: example/failure/ihdp-failure.md
              - Simulink:
                - Simulink to Python: example/simulink/sim_pyth.md
                - Your Simulink: example/simulink/your_sim.md
              - Unity:
                - Unity with DQN: example/enviroment/unity_example.md
              - Simintech:
                - Simintech: example/simintech/simintech.md
                - Simintech to Python: example/simintech/simintechToPython.md
            - Cookbook:
              - "01 — Hello, TensorAeroSpace": cookbook/01_hello.md
              - "02 — Anatomy of an env": cookbook/02_env_anatomy.md
              - "03 — Crafting reference signals": cookbook/03_reference_signals.md
              - "04 — Choosing an agent": cookbook/04_choosing_agent.md
              - "05 — Deep-RL training end-to-end": cookbook/05_deep_rl_training.md
              - "06 — Online-adaptive agents": cookbook/06_online_adaptive.md
              - "07 — Optuna hyperparameter search": cookbook/07_optuna_search.md
              - "08 — Save/load/publish to HuggingFace": cookbook/08_huggingface.md
              - "09 — Fault-tolerance": cookbook/09_fault_tolerance.md
              - "10 — Adding your own plant model": cookbook/10_custom_plant.md
              - "11 — IHDP on the nonlinear F-16": cookbook/11_ihdp.md
              - "12 — IM-GDHP on the nonlinear F-16": cookbook/12_imgdhp.md
              - "13 — ET-DHP on the nonlinear F-16": cookbook/13_etdhp.md
              - "14 — AA-INDI on the nonlinear F-16": cookbook/14_aaindi.md
              - "15 — ET-DHP under in-flight damage": cookbook/15_etdhp_damage.md
              - "16 — Interactive 3D viewer for F-16 flights": cookbook/16_3d_viewer.md
            - Lessons:
              - Theory:
                - "Lesson 1 — Introduction and State-Space": lesson/base/tutor_1.md
                - "Lesson 2 — Controllability and Observability": lesson/base/tutor_2.md
                - "Lesson 3 — Stability of Control Systems": lesson/base/tutor_3.md
                - "Lesson 4 — Fundamentals of Flight Dynamics": lesson/base/tutor_4.md
                - "Lesson 5 — Pole Placement Method": lesson/base/tutor_5.md
                - "Lesson 6 — Observers and the Separation Principle": lesson/base/tutor_6.md
                - "Lesson 7 — Practice: Longitudinal Stabilization": lesson/base/tutor_7.md
              - Reinforcement Learning:
                - "Lesson 8 — Introduction to RL for Aerospace": lesson/base/tutor_8.md
                - "Lesson 9 — Environments and Simulations": lesson/base/tutor_9.md
                - "Lesson 10 — Training Your First RL Agent": lesson/base/tutor_10.md
              - XFLR5:
                - Introduction: lesson/0intro.md
                - Airfoil Analysis: lesson/1analysis_airfoil.md
                - Plane Aero Analysis: lesson/2analysis_plane_aero.md
                - Plane Static Analysis: lesson/3analysis_plane_static.md
                - MATLAB Script: lesson/4matlabscript.md
                - Simulink Model: lesson/5simulinkmodel.md
                - DLL Generation: lesson/6dllgen.md
        - locale: ru
          name: Русский
          build: true
          nav:
