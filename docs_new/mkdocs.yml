site_name: TensorAeroSpace 
site_description: Open source deep learning framework for aerospace objects
site_url: https://tensoraerospace.github.io/TensorAeroSpace/
repo_url: https://github.com/TensorAeroSpace/TensorAeroSpace
repo_name: TensorAeroSpace/TensorAeroSpace
docs_dir: docs

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [".."]
          options:
            show_root_heading: true
            show_root_full_path: false
            merge_init_into_class: true
            members_order: source
            docstring_style: google
            heading_level: 2
            show_source: false

nav:
  - Home: index.md
  - User Guide:
    - Installation: guide/installation.md
    - Unity Environment: guide/unity_env.md
  - Aerospace Models:
    - F16: model/f16.md
    - B747: model/b747.md
    - EVL: model/evl.md
    - Typical Rocket: model/typical_rocket.md
    - ComSat: model/comsat.md
    - F4C: model/f4c.md
    - GeoSat: model/geosat.md
    - UAV: model/uav.md
    - X15: model/x15.md
    - LSU: model/lsu.md
    - SUAV: model/suav.md
    - Unity Environment: model/unity_env.md
  - Agents:
    - IHDP: 
      - Описание: agent/ihdp.md
      - Пример LinearLongitudinalF16‑v0: agent/ihdp/example.md
    - MPC: agent/mpc.md
    - DQN: agent/dqn.md
    - A3C: agent/a3c.md
    - A2C-NARX: agent/a2c_narx.md
    - PPO: agent/ppo.md
    - SAC: agent/sac.md
    - DDPG: agent/ddpg.md
    - GAIL: agent/gail.md
    - Optimization: optimization/optuna_based.md
    - Benchmark: benchmark/metrics.md
    - Signals: signals/signals.md
  - Examples:
    - Environments: example/env/examples.md
    - IHDP: example/agent/ihdp/example.md
    - SAC F16: example/agent/sac/example-sac-f16.md
    - Optimization: example/optimization/example_optimization.md
    - A2C-NARX: example/agent/a2c_narx/example-narx.md
    - MPC: example/agent/mpc/example_mpc.md
    - MPC Transformers: example/agent/mpc/example_transformers.md
    - IHDP Failure: example/failure/ihdp-failure.md
    - Simulink to Python: example/simulink/sim_pyth.md
    - Your Simulink: example/simulink/your_sim.md
    - Unity Example: example/env/unity_example.md
    - Simintech: example/simintech/simintech.md
    - Simintech to Python: example/simintech/simintechToPython.md
  - Lessons:
    - Introduction: lesson/0intro.md
    - Airfoil Analysis: lesson/1analysis_airfoil.md
    - Plane Aero Analysis: lesson/2analysis_plane_aero.md
    - Plane Static Analysis: lesson/3analysis_plane_static.md
    - MATLAB Script: lesson/4matlabscript.md
    - Simulink Model: lesson/5simulinkmodel.md
    - DLL Generation: lesson/6dllgen.md
    - Control Theory Basics: lesson/7control_basics.md
    - Flight Dynamics Intro: lesson/8flight_dynamics_intro.md

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.tabs
    - content.code.copy
  logo: logo.png
  favicon: logo.png

extra:
  static:
    - img
extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      linenums: false
      guess_lang: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - footnotes
  - def_list
