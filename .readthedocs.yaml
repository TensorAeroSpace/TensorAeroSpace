version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

  commands:
    - python -m pip install --upgrade pip
    - pip install poetry
    - poetry config virtualenvs.create false
    - poetry install --only dev --no-root
    - poetry run mkdocs build --site-dir "$READTHEDOCS_OUTPUT/html" --config-file mkdocs.yml
