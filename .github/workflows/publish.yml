
name: 🚀 Publish Python Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'testpypi'
        type: choice
        options:
        - testpypi
        - pypi

jobs:
  test-before-publish:
    name: 🧪 Test Before Publishing
    runs-on: ubuntu-latest
    
    steps:
    - name: 🧹 Free up disk space (diagnostic + cleanup)
      run: |
        set -euxo pipefail
        echo "Disk usage before cleanup:"
        df -h

        sudo rm -rf /usr/share/dotnet || true
        sudo rm -rf /usr/local/lib/android || true
        sudo rm -rf /opt/ghc || true
        sudo rm -rf /opt/hostedtoolcache/CodeQL || true

        docker system prune -af --volumes || true
        sudo apt-get clean || true

        echo "Disk usage after cleanup:"
        df -h

    - name: 📥 Checkout code
      uses: actions/checkout@v5

    - name: 🐍 Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: 🎭 Install Poetry
      run: |
        python -m ensurepip --upgrade || true
        python -m pip install --upgrade pip
        python -m pip install poetry

    - name: 📚 Install dependencies
      run: |
        poetry install --with dev

    - name: 🧪 Run tests
      run: |
        poetry run pytest tests/ -v

    - name: 🏗️ Build package
      run: |
        poetry build

    - name: ✅ Verify package
      run: |
        # Basic verification: check if dist files exist
        echo "📦 Built packages:"
        ls -lh dist/
        
        # Count wheel and source distribution files
        WHL_COUNT=$(ls dist/*.whl 2>/dev/null | wc -l)
        TAR_COUNT=$(ls dist/*.tar.gz 2>/dev/null | wc -l)
        
        if [ "$WHL_COUNT" -eq 0 ] || [ "$TAR_COUNT" -eq 0 ]; then
          echo "❌ Error: Package files not found in dist/"
          echo "Expected: .whl and .tar.gz files"
          exit 1
        fi
        
        echo "✅ Package verification passed"
        echo "  - Found $WHL_COUNT wheel file(s)"
        echo "  - Found $TAR_COUNT source distribution(s)"


  publish-pypi:
    name: 🚀 Publish to PyPI
    runs-on: ubuntu-latest
    needs: test-before-publish
    if: github.event.inputs.environment == 'pypi' || (github.event_name == 'release' && github.event.action == 'published' && !contains(github.ref, 'alpha'))
    environment: pypi

    steps:
    - name: 🧹 Free up disk space (diagnostic + cleanup)
      run: |
        set -euxo pipefail
        echo "Disk usage before cleanup:"
        df -h

        sudo rm -rf /usr/share/dotnet || true
        sudo rm -rf /usr/local/lib/android || true
        sudo rm -rf /opt/ghc || true
        sudo rm -rf /opt/hostedtoolcache/CodeQL || true

        docker system prune -af --volumes || true
        sudo apt-get clean || true

        echo "Disk usage after cleanup:"
        df -h

    - name: 📥 Checkout code
      uses: actions/checkout@v5

    - name: 🐍 Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: 🎭 Install Poetry
      run: |
        python -m ensurepip --upgrade || true
        python -m pip install --upgrade pip
        python -m pip install poetry

    - name: 📚 Install dependencies
      run: |
        poetry install

    - name: 🏷️ Set version from tag
      if: github.event_name == 'release'
      run: |
        VERSION="${{ github.event.release.tag_name }}"
        VERSION="${VERSION#v}"
        echo "Setting package version to $VERSION from tag"
        poetry version "$VERSION"

    - name: 🏗️ Build package
      run: |
        poetry build

    - name: 🚀 Publish to PyPI
      env:
        POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_PUBLISH }}
      run: |
        poetry publish
      continue-on-error: true

  readthedocs-release:
    name: 📚 Trigger Read the Docs (release tag + latest)
    runs-on: ubuntu-latest
    needs: publish-pypi
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
    - name: 🔔 Trigger RTD webhook for tag and latest
      env:
        RTD_WEBHOOK_URL: ${{ secrets.READTHEDOCS_WEBHOOK_URL }}
        RTD_WEBHOOK_SECRET: ${{ secrets.READTHEDOCS_WEBHOOK_SECRET }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        if [ -z "$RTD_WEBHOOK_URL" ] || [ -z "$RTD_WEBHOOK_SECRET" ]; then
          echo "READTHEDOCS_WEBHOOK_URL/SECRET not set. Skipping RTD trigger." && exit 0
        fi
        REPO="$GITHUB_REPOSITORY"
        TAG_NAME="${{ github.event.release.tag_name }}"
        # 1) Trigger build for the released tag
        REF_TAG="refs/tags/${TAG_NAME}"
        DATA_TAG="{\"ref\":\"$REF_TAG\",\"repository\":{\"full_name\":\"$REPO\"}}"
        SIG_SHA1=$(printf '%s' "$DATA_TAG" | openssl dgst -sha1 -hmac "$RTD_WEBHOOK_SECRET" | awk '{print $2}')
        SIG_SHA256=$(printf '%s' "$DATA_TAG" | openssl dgst -sha256 -hmac "$RTD_WEBHOOK_SECRET" | awk '{print $2}')
        echo "Triggering RTD for tag $REF_TAG"
        curl -sS -X POST \
          -H "Content-Type: application/json" \
          -H "X-GitHub-Event: push" \
          -H "X-Hub-Signature: sha1=${SIG_SHA1}" \
          -H "X-Hub-Signature-256: sha256=${SIG_SHA256}" \
          "$RTD_WEBHOOK_URL" \
          -d "$DATA_TAG" \
          | tee rtd_response_tag.json
        # 2) Trigger build for latest (default branch)
        REF_LATEST="refs/heads/${DEFAULT_BRANCH:-main}"
        DATA_LATEST="{\"ref\":\"$REF_LATEST\",\"repository\":{\"full_name\":\"$REPO\"}}"
        SIG_SHA1_L=$(printf '%s' "$DATA_LATEST" | openssl dgst -sha1 -hmac "$RTD_WEBHOOK_SECRET" | awk '{print $2}')
        SIG_SHA256_L=$(printf '%s' "$DATA_LATEST" | openssl dgst -sha256 -hmac "$RTD_WEBHOOK_SECRET" | awk '{print $2}')
        echo "Triggering RTD for latest $REF_LATEST"
        curl -sS -X POST \
          -H "Content-Type: application/json" \
          -H "X-GitHub-Event: push" \
          -H "X-Hub-Signature: sha1=${SIG_SHA1_L}" \
          -H "X-Hub-Signature-256: sha256=${SIG_SHA256_L}" \
          "$RTD_WEBHOOK_URL" \
          -d "$DATA_LATEST" \
          | tee rtd_response_latest.json