
name: 🚀 Publish Python Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'testpypi'
        type: choice
        options:
        - testpypi
        - pypi

jobs:
  test-before-publish:
    name: 🧪 Test Before Publishing
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 🎭 Install Poetry
      run: |
        python -m ensurepip --upgrade || true
        python -m pip install --upgrade pip
        python -m pip install poetry

    - name: 📚 Install dependencies
      run: |
        poetry install --with dev

    - name: 🧪 Run tests
      run: |
        poetry run pytest tests/ -v

    - name: 🏗️ Build package
      run: |
        poetry build

    - name: ✅ Verify package
      run: |
        poetry run twine check dist/*


  publish-pypi:
    name: 🚀 Publish to PyPI
    runs-on: ubuntu-latest
    needs: test-before-publish
    if: github.event.inputs.environment == 'pypi' || (github.event_name == 'release' && github.event.action == 'published' && !contains(github.ref, 'alpha'))
    environment: pypi

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 🎭 Install Poetry
      run: |
        python -m ensurepip --upgrade || true
        python -m pip install --upgrade pip
        python -m pip install poetry

    - name: 📚 Install dependencies
      run: |
        poetry install

    - name: 🏷️ Set version from tag
      if: github.event_name == 'release'
      run: |
        VERSION="${{ github.event.release.tag_name }}"
        VERSION="${VERSION#v}"
        echo "Setting package version to $VERSION from tag"
        poetry version "$VERSION"

    - name: 🏗️ Build package
      run: |
        poetry build

    - name: 🚀 Publish to PyPI
      env:
        POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_PUBLISH }}
      run: |
        poetry publish
      continue-on-error: true