name: ⚡ Quick Check
run-name: ${{ github.actor }} is running quick checks 🔍

on:
  push:
    branches:
      - '**'  # Запускать на всех ветках

jobs:
  quick-test:
    name: ⚡ Quick Test (Python 3.10, Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: 🧹 Free up disk space (diagnostic + cleanup)
      run: |
        set -euxo pipefail
        echo "Disk usage before cleanup:"
        df -h

        # Remove large preinstalled components we don't need for Python tests
        sudo rm -rf /usr/share/dotnet || true
        sudo rm -rf /usr/local/lib/android || true
        sudo rm -rf /opt/ghc || true
        sudo rm -rf /opt/hostedtoolcache/CodeQL || true

        # Best-effort cleanup
        docker system prune -af --volumes || true
        sudo apt-get clean || true

        echo "Disk usage after cleanup:"
        df -h

    - name: 📥 Checkout code
      uses: actions/checkout@v5

    - name: 🐍 Set up Python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: 📦 Cache Poetry dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pypoetry
        key: ubuntu-latest-poetry-3.10-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          ubuntu-latest-poetry-3.10-

    - name: 🎭 Install Poetry
      run: |
        python -m ensurepip --upgrade || true
        python -m pip install --upgrade pip
        python -m pip install poetry

    - name: ⚙️ Configure Poetry
      run: |
        poetry config virtualenvs.create true
        poetry config virtualenvs.in-project true

    - name: 🔒 Verify lock file
      run: |
        poetry check --lock

    - name: 📚 Install dependencies
      run: |
        poetry install --only main,test --no-interaction

    - name: 🔍 Quick lint check
      run: |
        poetry run python -m compileall -q tensoraerospace

    - name: 🧪 Run core tests only
      run: |
        poetry run pytest tests/envs/ -v --tb=short -x --maxfail=3

    - name: ✅ Quick import test
      run: |
        poetry run python -c "import tensoraerospace; print('✅ Import successful')"

  code-quality:
    name: 📝 Code Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: 🧹 Free up disk space (diagnostic + cleanup)
      run: |
        set -euxo pipefail
        echo "Disk usage before cleanup:"
        df -h

        sudo rm -rf /usr/share/dotnet || true
        sudo rm -rf /usr/local/lib/android || true
        sudo rm -rf /opt/ghc || true
        sudo rm -rf /opt/hostedtoolcache/CodeQL || true

        docker system prune -af --volumes || true
        sudo apt-get clean || true

        echo "Disk usage after cleanup:"
        df -h

    - name: 📥 Checkout code
      uses: actions/checkout@v5

    - name: 🐍 Set up Python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: 🎭 Install Poetry
      run: |
        python -m ensurepip --upgrade || true
        python -m pip install --upgrade pip
        python -m pip install poetry

    - name: 🔒 Verify lock file
      run: |
        poetry check --lock

    - name: 📚 Install dependencies
      run: |
        # Only tooling is needed here (no heavy runtime deps)
        poetry install --only dev --no-interaction

    - name: 🔍 Check code formatting with black
      run: |
        poetry run black --check --diff tensoraerospace/

    - name: 📏 Check import sorting with isort
      run: |
        poetry run isort --check-only --diff tensoraerospace/

    - name: 🔍 Basic flake8 check
      run: |
        poetry run flake8 tensoraerospace --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: 🧱 Baseline quality gate
      run: |
        poetry run python scripts/ci_quality_gate.py flake8 ruff

  dependency-check:
    name: 🔒 Dependency Security Check
    runs-on: ubuntu-latest
    # 5 min was not enough — `poetry install --with dev` alone takes 3-4 min on a
    # cold cache, and a dependency audit adds another 1-2 min for the advisory DB.
    # Bumped to 15 min and added the official poetry cache so warm runs finish
    # in under 4 min.
    timeout-minutes: 15

    steps:
    - name: 🧹 Free up disk space (diagnostic + cleanup)
      run: |
        set -euxo pipefail
        echo "Disk usage before cleanup:"
        df -h

        sudo rm -rf /usr/share/dotnet || true
        sudo rm -rf /usr/local/lib/android || true
        sudo rm -rf /opt/ghc || true
        sudo rm -rf /opt/hostedtoolcache/CodeQL || true

        docker system prune -af --volumes || true
        sudo apt-get clean || true

        echo "Disk usage after cleanup:"
        df -h

    - name: 📥 Checkout code
      uses: actions/checkout@v5

    - name: 🐍 Set up Python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: 🎭 Install Poetry
      run: |
        python -m ensurepip --upgrade || true
        python -m pip install --upgrade pip
        python -m pip install poetry

    - name: 💾 Cache poetry virtualenv
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pypoetry/virtualenvs
          ~/.cache/pypoetry/cache
        key: poetry-venv-${{ runner.os }}-py3.10-${{ hashFiles('poetry.lock') }}
        restore-keys: |
          poetry-venv-${{ runner.os }}-py3.10-

    - name: 🔒 Verify lock file
      run: |
        poetry check --lock

    - name: 📚 Install dependencies
      run: |
        poetry install --with dev --no-interaction

    - name: 🔍 Check for known security vulnerabilities (pip-audit)
      run: |
        poetry run python -m pip install --quiet "pip-audit>=2.10,<3"
        poetry run python scripts/dependency_audit_gate.py

    - name: 📋 Show dependency tree
      run: |
        poetry show --tree
