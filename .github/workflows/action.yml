name: 🧪 Test and Coverage
run-name: ${{ github.actor }} is testing TensorAeroSpace 🚀

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  version-gate:
    name: 🏷️ Version Tag Gate
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code with tags
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: 🎭 Install Poetry
        run: |
          python -m ensurepip --upgrade || true
          python -m pip install --upgrade pip
          python -m pip install poetry

      - name: ⚙️ Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: 🏷️ Verify pyproject version is release-ready vs latest stable tag
        # Release-prep PRs (e.g. ``develop -> main`` with a version bump) need
        # ``pyproject.toml`` to land BEFORE the matching tag exists, so a strict
        # equality check would always fail. ``--check-release-ready`` accepts
        # either equality with the latest stable tag or a single-step increment
        # (patch+1, minor+1.0, or major+1.0.0). The strict equality check still
        # runs at release publish time via ``--check-tag`` in publish.yml.
        run: |
          poetry run python scripts/version_gate.py --check-release-ready

  test:
    name: 🐍 Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: 🧹 Free up disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune -af --volumes || true
          sudo apt-get clean
          df -h

      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 Cache Poetry dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: ubuntu-latest-poetry-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ubuntu-latest-poetry-${{ matrix.python-version }}-

      - name: 🎭 Install Poetry
        run: |
          python -m ensurepip --upgrade || true
          python -m pip install --upgrade pip
          python -m pip install poetry

      - name: ⚙️ Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: 🔒 Verify lock file
        run: |
          poetry check --lock

      - name: 📚 Install dependencies
        run: |
          poetry install --with dev,test --no-interaction

      - name: 🔍 Fatal lint check
        run: |
          poetry run flake8 tensoraerospace --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: 🧪 Run tests with pytest
        run: |
          poetry run pytest tests/ -v --tb=short --junitxml=pytest.xml \
            --ignore=tests/agents/a2c_narx_learner_test.py \
            --ignore=tests/optimization/ray_test.py

      - name: 📊 Run tests with coverage
        if: matrix.python-version == '3.11'
        run: |
          set -o pipefail
          poetry run pytest --maxfail=1 --disable-warnings \
            --cov=tensoraerospace \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing:skip-covered \
            --ignore=tests/agents/a2c_narx_learner_test.py \
            --ignore=tests/optimization/ray_test.py | tee pytest-coverage.txt

      - name: ☁️ Upload coverage to Coveralls
        if: ${{ matrix.python-version == '3.11' && success() && hashFiles('coverage.xml') != '' }}
        uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: ./coverage.xml
          format: cobertura

      - name: 💬 Pytest coverage comment
        if: github.event_name == 'pull_request' && matrix.python-version == '3.11'
        uses: MishaKav/pytest-coverage-comment@v1.7.2
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          pytest-xml-coverage-path: ./coverage.xml
          title: 📊 TensorAeroSpace Coverage Report
          badge-title: Coverage
          hide-badge: false
          hide-report: true
          create-new-comment: false
          hide-comment: false
          report-only-changed-files: true
          xml-skip-covered: true
          remove-links-to-files: true
          remove-links-to-lines: true
          remove-link-from-badge: true
          unique-id-for-comment: python3.11
          junitxml-path: ./pytest.xml
          junitxml-title: 🧪 TensorAeroSpace Test Results

      - name: 🧹 Clean up temporary files
        if: always()
        run: |
          rm -rf .pytest_cache .coverage htmlcov .tox
          pip cache purge || true

  test-matrix-result:
    name: ✅ All Python versions passed
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: ❗ Fail if any matrix Python version failed
        run: |
          echo "Aggregated result of the test matrix: ${{ needs.test.result }}"
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::Tests did not pass on every Python version (3.10/3.11/3.12/3.13). Blocking the PR."
            exit 1
          fi
          echo "All Python versions (3.10/3.11/3.12/3.13) passed."

  quality-gates:
    name: 🧱 Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: 📦 Cache Poetry dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: ubuntu-latest-poetry-quality-3.10-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ubuntu-latest-poetry-quality-3.10-

      - name: 🎭 Install Poetry
        run: |
          python -m ensurepip --upgrade || true
          python -m pip install --upgrade pip
          python -m pip install poetry

      - name: ⚙️ Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: 🔒 Verify lock file
        run: |
          poetry check --lock

      - name: 📚 Install main and dev dependencies
        run: |
          poetry install --only main,dev --no-interaction

      - name: 🎨 Check formatting with black
        run: |
          poetry run black --workers 1 --check --diff tensoraerospace/

      - name: 📏 Check import sorting with isort
        run: |
          poetry run isort --check-only --diff tensoraerospace/

      - name: 🔍 Fatal lint check
        run: |
          poetry run flake8 tensoraerospace --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: 🧱 Run baseline quality gates
        run: |
          poetry run python scripts/ci_quality_gate.py flake8 ruff mypy

  docs-coverage:
    name: 📚 Documentation Coverage
    runs-on: ubuntu-latest
    needs: quality-gates

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: 📦 Cache Poetry dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: ubuntu-latest-poetry-docs-3.10-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ubuntu-latest-poetry-docs-3.10-

      - name: 🎭 Install Poetry
        run: |
          python -m ensurepip --upgrade || true
          python -m pip install --upgrade pip
          python -m pip install poetry

      - name: ⚙️ Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: 🔒 Verify lock file
        run: |
          poetry check --lock

      - name: 📚 Install dependencies
        run: |
          poetry install --with dev --no-interaction

      - name: 📖 Run documentation coverage
        run: |
          set -o pipefail
          poetry run docstr-coverage ./tensoraerospace \
            --skip-magic --skip-init --skip-file-doc \
            --fail-under=70.0 2>&1 | tee docstr-coverage.txt

      - name: 🔢 Extract docstring coverage percent
        id: docstr
        shell: bash
        run: |
          PY_OUTPUT=$(python - <<'PY'
          import re
          with open('docstr-coverage.txt', encoding='utf-8', errors='ignore') as file:
              text = file.read()
          matches = re.findall(r"([0-9]+(?:\.[0-9]+)?)%", text)
          pct = matches[-1] if matches else "0"
          grade_match = re.search(r"Grade:\s*([A-Za-z]+)", text)
          grade = grade_match.group(1) if grade_match else ""
          print(f"{pct} {grade}")
          PY
          )
          read -r PCT GRADE <<< "$PY_OUTPUT"
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"
          echo "grade=$GRADE" >> "$GITHUB_OUTPUT"
          PCT_INT=${PCT%.*}
          COLOR=red
          if [ "$PCT_INT" -ge 90 ]; then
            COLOR=brightgreen
          elif [ "$PCT_INT" -ge 80 ]; then
            COLOR=green
          elif [ "$PCT_INT" -ge 70 ]; then
            COLOR=yellowgreen
          elif [ "$PCT_INT" -ge 60 ]; then
            COLOR=yellow
          else
            COLOR=orange
          fi
          echo "color=$COLOR" >> "$GITHUB_OUTPUT"

      - name: 📝 Build PR comment
        if: github.event_name == 'pull_request'
        run: |
          cat > docstr-comment.md <<MD
          ### 📚 Docstring coverage

          ![Docstring coverage](https://img.shields.io/badge/docstring--coverage-${{ steps.docstr.outputs.pct }}%25-${{ steps.docstr.outputs.color }})

          Coverage: ${{ steps.docstr.outputs.pct }}%
          MD

      - name: 💬 Post sticky PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          recreate: true
          header: docstring-coverage
          path: docstr-comment.md

  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: quality-gates

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: 📦 Cache Poetry dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: ubuntu-latest-poetry-security-3.10-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ubuntu-latest-poetry-security-3.10-

      - name: 🎭 Install Poetry
        run: |
          python -m ensurepip --upgrade || true
          python -m pip install --upgrade pip
          python -m pip install poetry

      - name: ⚙️ Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: 🔒 Verify lock file
        run: |
          poetry check --lock

      - name: 📚 Install dev dependencies
        run: |
          poetry install --only dev --no-interaction

      - name: 🛡️ Run Bandit baseline gate
        run: |
          poetry run python scripts/ci_quality_gate.py bandit

      - name: 🔍 Run dependency audit baseline gate
        run: |
          poetry run python -m pip install --quiet "pip-audit>=2.10,<3"
          poetry run python scripts/dependency_audit_gate.py

  build:
    name: 🏗️ Build Package
    runs-on: ubuntu-latest
    needs: [version-gate, test-matrix-result, docs-coverage, security]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: 📦 Cache Poetry dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: ubuntu-latest-poetry-build-3.10-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ubuntu-latest-poetry-build-3.10-

      - name: 🎭 Install Poetry
        run: |
          python -m ensurepip --upgrade || true
          python -m pip install --upgrade pip
          python -m pip install poetry

      - name: ⚙️ Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: 🔒 Verify lock file
        run: |
          poetry check --lock

      - name: 📚 Install dependencies
        run: |
          poetry install --with dev --no-interaction

      - name: 🏷️ Set version suffix
        shell: bash
        run: |
          BASE_VERSION=$(poetry version -s)
          NEW_VERSION="${BASE_VERSION}.dev$(date +%Y%m%d%H%M%S)"
          echo "Setting dynamic version: $NEW_VERSION"
          poetry version "$NEW_VERSION"

      - name: 🏗️ Build package
        run: |
          poetry build

      - name: ✅ Verify package metadata
        run: |
          poetry run twine check dist/*

      - name: 📦 Run package gate
        run: |
          poetry run python scripts/package_gate.py

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  package-install-matrix:
    name: 📦 Wheel Install Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 Cache pip downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ubuntu-latest-wheel-install-${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            ubuntu-latest-wheel-install-${{ matrix.python-version }}-

      - name: 📦 Install built wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl

      - name: 🧪 Import installed package
        run: |
          python - <<'PY'
          import importlib.metadata as metadata
          import tensoraerospace

          print(f"installed tensoraerospace {metadata.version('tensoraerospace')}")
          print(f"module path: {tensoraerospace.__file__}")
          PY

  package-install-result:
    name: 📦 Wheel installs on all Python versions
    runs-on: ubuntu-latest
    needs: package-install-matrix
    if: always()

    steps:
      - name: ❗ Fail if any wheel install check failed
        run: |
          echo "Aggregated result of the wheel install matrix: ${{ needs.package-install-matrix.result }}"
          if [ "${{ needs.package-install-matrix.result }}" != "success" ]; then
            echo "::error::Built wheel did not install/import on every Python version (3.10/3.11/3.12/3.13). Blocking the PR."
            exit 1
          fi
          echo "Built wheel installed and imported on Python 3.10/3.11/3.12/3.13."

  readthedocs-build:
    name: 📚 Trigger Read the Docs (develop)
    runs-on: ubuntu-latest
    needs: docs-coverage
    if: github.event_name == 'pull_request' && (github.base_ref == 'develop' || (github.base_ref == 'main' && github.head_ref == 'develop'))

    steps:
      - name: 🔔 Trigger RTD webhook for develop
        env:
          RTD_WEBHOOK_URL: ${{ secrets.READTHEDOCS_WEBHOOK_URL }}
          RTD_WEBHOOK_SECRET: ${{ secrets.READTHEDOCS_WEBHOOK_SECRET }}
        run: |
          if [ -z "$RTD_WEBHOOK_URL" ] || [ -z "$RTD_WEBHOOK_SECRET" ]; then
            echo "READTHEDOCS_WEBHOOK_URL/SECRET not set. Skipping RTD trigger."
            exit 0
          fi
          SIG_SHA1=$(openssl dgst -sha1 -hmac "$RTD_WEBHOOK_SECRET" "$GITHUB_EVENT_PATH" | awk '{print $2}')
          SIG_SHA256=$(openssl dgst -sha256 -hmac "$RTD_WEBHOOK_SECRET" "$GITHUB_EVENT_PATH" | awk '{print $2}')
          curl -sS -X POST \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: pull_request" \
            -H "X-Hub-Signature: sha1=${SIG_SHA1}" \
            -H "X-Hub-Signature-256: sha256=${SIG_SHA256}" \
            "$RTD_WEBHOOK_URL" \
            --data-binary @"$GITHUB_EVENT_PATH" \
            | tee rtd_response.json
