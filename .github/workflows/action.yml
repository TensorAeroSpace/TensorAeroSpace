name: 🧪 Test and Coverage
run-name: ${{ github.actor }} is testing TensorAeroSpace 🚀

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:  # Позволяет запускать вручную

jobs:
  test:
    name: 🐍 Test Python 3.10 on self-hosted
    runs-on: ubuntu-latest

    steps:
    - name: 🧹 Free up disk space
      run: |
        echo "Disk usage before cleanup:"
        
        
        # Remove large unnecessary packages
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        
        # Clean Docker
        docker system prune -af --volumes || true
        
        # Clean apt cache
        sudo apt-get clean
        
        echo "Disk usage after cleanup:"
        
    
    - name: 📥 Checkout code
      uses: actions/checkout@v5

    - name: 🐍 Set up Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: 📦 Cache Poetry dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pypoetry
          ~/.cache/pip
        key: ubuntu-latest-poetry-3.10-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          ubuntu-latest-poetry-3.10-

    - name: 🎭 Install Poetry
      run: |
        python -m ensurepip --upgrade || true
        python -m pip install --upgrade pip
        python -m pip install poetry

    - name: ⚙️ Configure Poetry
      run: |
        poetry config virtualenvs.create true
        poetry config virtualenvs.in-project true

    - name: 🔄 Check and update lock file if needed
      run: |
        if ! poetry check --lock; then
          echo "Lock file is outdated, updating..."
          poetry lock
        fi

    - name: 📚 Install dependencies
      run: |
        poetry install --with dev

    - name: 🔍 Lint with flake8 (Ubuntu only)
      run: |
        poetry run flake8 tensoraerospace --count --select=E9,F63,F7,F82 --show-source --statistics
        poetry run flake8 tensoraerospace --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: 🧪 Run tests with pytest
      run: |
        poetry run pytest tests/ -v --tb=short --junitxml=pytest.xml \
          --ignore=tests/agents/ihdp_actor_test.py \
          --ignore=tests/agents/ihdp_critic_test.py \
          --ignore=tests/agents/ihdp_agent_test.py \
          --ignore=tests/agents/ihdp_incremental_model_test.py \
          --ignore=tests/agents/a2c_narx_learner_test.py \
          --ignore=tests/optimization/ray_test.py

    - name: Run tests with coverage
      run: |
        poetry run pytest --maxfail=1 --disable-warnings \
              --cov=tensoraerospace \
              --cov-report=xml:coverage.xml \
              --cov-report=term-missing:skip-covered \
              --ignore=tests/agents/ihdp_actor_test.py \
              --ignore=tests/agents/ihdp_critic_test.py \
              --ignore=tests/agents/ihdp_agent_test.py \
              --ignore=tests/agents/ihdp_incremental_model_test.py \
              --ignore=tests/agents/a2c_narx_learner_test.py \
              --ignore=tests/optimization/ray_test.py | tee pytest-coverage.txt

    - name: Upload coverage to Coveralls
      if: ${{ success() && hashFiles('coverage.xml') != '' }}
      uses: coverallsapp/github-action@v2
      continue-on-error: true
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        file: ./coverage.xml
        format: cobertura

    - name: 💬 Pytest coverage comment
      if: github.event_name == 'pull_request'
      uses: MishaKav/pytest-coverage-comment@main
      with:
        pytest-coverage-path: ./pytest-coverage.txt
        pytest-xml-coverage-path: ./coverage.xml
        title: 📊 TensorAeroSpace Coverage Report — [Coveralls](https://coveralls.io/github/${{ github.repository }}?branch=${{ github.head_ref }})
        badge-title: Coverage
        hide-badge: false
        hide-report: true
        create-new-comment: false
        hide-comment: false
        report-only-changed-files: true
        xml-skip-covered: true
        remove-links-to-files: true
        remove-links-to-lines: true
        remove-link-from-badge: true
        unique-id-for-comment: python3.10
        junitxml-path: ./pytest.xml
        junitxml-title: 🧪 TensorAeroSpace Test Results

    - name: 🔗 Add Coveralls link comment
      if: github.event_name == 'pull_request'
      run: |
        PCT=$(python - <<'PY'
        import xml.etree.ElementTree as ET
        try:
            root=ET.parse('coverage.xml').getroot()
            pct=float(root.attrib.get('line-rate','0'))*100
            print(f"{pct:.1f}")
        except Exception:
            print("0")
        PY
        )
        cat > coverage-link.md <<MD
        ### 🔗 Coverage Links
        - Coverage: ${PCT}% — [Coveralls report](https://coveralls.io/github/${{ github.repository }}?branch=${{ github.head_ref }})
        MD
    - name: 💬 Post sticky PR comment (Coveralls link)
      if: github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@v3
      with:
        recreate: true
        header: coverage-links
        path: coverage-link.md
    
    - name: 🧹 Clean up temporary files
      if: always()
      run: |
        # Remove test artifacts and cache
        rm -rf .pytest_cache
        rm -rf .coverage
        rm -rf htmlcov
        rm -rf .tox
        # Clean pip cache
        pip cache purge || true
        echo "Disk usage after test cleanup:"
        

  docs-coverage:
    name: 📚 Documentation Coverage
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: 🧹 Free up disk space
      run: |
        echo "Disk usage before cleanup:"
        
        
        # Remove large unnecessary packages
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        
        # Clean Docker
        docker system prune -af --volumes || true
        
        # Clean apt cache
        sudo apt-get clean
        
        echo "Disk usage after cleanup:"
        
    
    - name: 📥 Checkout code
      uses: actions/checkout@v5

    - name: 🐍 Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: 📦 Cache Poetry dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pypoetry
          ~/.cache/pip
        key: ubuntu-latest-poetry-3.10-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          ubuntu-latest-poetry-3.10-

    - name: 🎭 Install Poetry
      run: |
        python -m ensurepip --upgrade || true
        python -m pip install --upgrade pip
        python -m pip install poetry

    - name: ⚙️ Configure Poetry
      run: |
        poetry config virtualenvs.create true
        poetry config virtualenvs.in-project true

    - name: 📚 Install dependencies
      run: |
        poetry install --with dev

    - name: 📖 Run Documentation Coverage
      run: |
        # Не падаем по порогу, чтобы всё равно опубликовать комментарий
        poetry run docstr-coverage ./tensoraerospace \
          --skip-magic --skip-init --skip-file-doc \
          --fail-under=70.0 2>&1 | tee docstr-coverage.txt || true

    - name: 🔢 Extract docstring coverage percent
      id: docstr
      shell: bash
      run: |
        PY_OUTPUT=$(python - <<'PY'
        import re
        with open('docstr-coverage.txt', encoding='utf-8', errors='ignore') as f:
            txt=f.read()
        pct=None
        # 1) Самый надёжный способ: посчитать из Needed/Found
        m=re.search(r"Needed:\s*(\d+)\s*[-|].*?Found:\s*(\d+)", txt, re.I|re.S)
        if m:
            needed=int(m.group(1)) or 1
            found=int(m.group(2))
            pct=f"{found*100.0/needed:.1f}"
        # 2) Пытаться вытащить из итоговой строки
        if pct is None:
            for p in (
                r"Total\s+coverage:\s*([0-9]+(?:\.[0-9]+)?)%",
                r"overall\s+documentation\s+coverage\s+is\s+([0-9]+(?:\.[0-9]+)?)%",
            ):
                m=re.search(p, txt, re.I)
                if m:
                    pct=m.group(1)
                    break
        # 3) Фоллбек: любое адекватное последнее число процентов
        if pct is None:
            ms=re.findall(r"([0-9]+(?:\.[0-9]+)?)%", txt)
            pct=ms[-1] if ms else '0'
        grade_match=re.search(r"Grade:\s*([A-Za-z]+)", txt)
        grade=grade_match.group(1) if grade_match else ''
        print(f"{pct} {grade}")
        PY
        )
        read -r PCT GRADE <<< "$PY_OUTPUT"
        echo "pct=$PCT" >> $GITHUB_OUTPUT
        echo "grade=$GRADE" >> $GITHUB_OUTPUT
        PCT_INT=${PCT%.*}
        COLOR=red
        if [ "$PCT_INT" -ge 90 ]; then COLOR=brightgreen; elif [ "$PCT_INT" -ge 80 ]; then COLOR=green; elif [ "$PCT_INT" -ge 70 ]; then COLOR=yellowgreen; elif [ "$PCT_INT" -ge 60 ]; then COLOR=yellow; else COLOR=orange; fi
        echo "color=$COLOR" >> $GITHUB_OUTPUT

    - name: 📝 Build PR comment (docstring coverage)
      if: github.event_name == 'pull_request'
      run: |
        cat > docstr-comment.md <<MD
        ### 📚 Docstring coverage

        ![Docstring coverage](https://img.shields.io/badge/docstring--coverage-${{ steps.docstr.outputs.pct }}%25-${{ steps.docstr.outputs.color }})

        Coverage: ${{ steps.docstr.outputs.pct }}%${{ steps.docstr.outputs.grade && format(' — Grade: {0}', steps.docstr.outputs.grade) || '' }}


    - name: 💬 Post sticky PR comment (docstring coverage)
      if: github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@v3
      with:
        recreate: true
        path: docstr-comment.md

  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: 🧹 Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        docker system prune -af --volumes || true
        sudo apt-get clean
    
    - name: 📥 Checkout code
      uses: actions/checkout@v5

    - name: 🐍 Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: 🎭 Install Poetry
      run: |
        python -m ensurepip --upgrade || true
        python -m pip install --upgrade pip
        python -m pip install poetry

    - name: 📚 Install dependencies
      run: |
        poetry install --with dev

    - name: 🔍 Run safety check
      run: |
        poetry run safety check --json || true

    - name: 🛡️ Run bandit security scan
      run: |
        poetry run bandit -r tensoraerospace -f json || true

  build:
    name: 🏗️ Build Package
    runs-on: ubuntu-latest
    needs: [test, docs-coverage]

    steps:
    - name: 🧹 Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        docker system prune -af --volumes || true
        sudo apt-get clean
    
    - name: 📥 Checkout code
      uses: actions/checkout@v5

    - name: 🐍 Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: 🎭 Install Poetry
      run: |
        python -m ensurepip --upgrade || true
        python -m pip install --upgrade pip
        python -m pip install poetry

    - name: 📚 Install dependencies
      run: |
        poetry install

    - name: 🏷️ Set version suffix (branch + short SHA)
      shell: bash
      run: |
        BASE_VERSION=$(poetry version -s)
        # PEP 440: TestPyPI/PyPI не принимают локальные версии с '+'
        # Используем допустимый dev-релиз с числовым суффиксом (timestamp)
        NEW_VERSION="${BASE_VERSION}.dev$(date +%Y%m%d%H%M%S)"
        echo "Setting dynamic version: $NEW_VERSION"
        poetry version "$NEW_VERSION"

    - name: 🏗️ Build package
      run: |
        poetry build

    - name: 📦 Upload build artifacts
      uses: actions/upload-artifact@v7
      continue-on-error: true
      with:
        name: dist
        path: dist/

  publish-github-packages:
    name: 📦 Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: build
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      packages: write

    steps:
    - name: 📥 Download build artifacts
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist

    - name: 🐍 Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: 📦 Install Twine
      run: |
        python -m pip install --upgrade pip
        pip install twine

    - name: 🚀 Publish to TestPyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_TEST }}
      run: |
        twine upload \
          --repository-url https://test.pypi.org/legacy/ \
          dist/*


  readthedocs-build:
    name: 📚 Trigger Read the Docs (develop)
    runs-on: ubuntu-latest
    needs: docs-coverage
    if: github.event_name == 'pull_request' && (github.base_ref == 'develop' || (github.base_ref == 'main' && github.head_ref == 'develop'))

    steps:
    - name: 🔔 Trigger RTD webhook for develop
      env:
        RTD_WEBHOOK_URL: ${{ secrets.READTHEDOCS_WEBHOOK_URL }}
        RTD_WEBHOOK_SECRET: ${{ secrets.READTHEDOCS_WEBHOOK_SECRET }}
      run: |
        if [ -z "$RTD_WEBHOOK_URL" ] || [ -z "$RTD_WEBHOOK_SECRET" ]; then
          echo "READTHEDOCS_WEBHOOK_URL/SECRET not set. Skipping RTD trigger." && exit 0
        fi
        # Send the original PR event payload so RTD can build the correct external version
        # Compute HMAC signatures over the exact body
        SIG_SHA1=$(openssl dgst -sha1 -hmac "$RTD_WEBHOOK_SECRET" "$GITHUB_EVENT_PATH" | awk '{print $2}')
        SIG_SHA256=$(openssl dgst -sha256 -hmac "$RTD_WEBHOOK_SECRET" "$GITHUB_EVENT_PATH" | awk '{print $2}')
        curl -sS -X POST \
          -H "Content-Type: application/json" \
          -H "X-GitHub-Event: pull_request" \
          -H "X-Hub-Signature: sha1=${SIG_SHA1}" \
          -H "X-Hub-Signature-256: sha256=${SIG_SHA256}" \
          "$RTD_WEBHOOK_URL" \
          --data-binary @"$GITHUB_EVENT_PATH" \
          | tee rtd_response.json
        echo "RTD response:" && cat rtd_response.json
