# Pre-commit hooks для TensorAeroSpace
# Установка: pip install pre-commit && pre-commit install

repos:
  # Базовые проверки
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-docstring-first

  # Форматирование кода с black
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3
        args: [--config=pyproject.toml]

  # Сортировка импортов с isort
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=88]

  # Локальные baseline gate-ы. Они совпадают с Makefile и GitHub Actions.
  - repo: local
    hooks:
      - id: quality-baseline
        name: quality-baseline
        entry: poetry run python scripts/ci_quality_gate.py flake8 ruff mypy
        language: system
        pass_filenames: false
      - id: bandit-baseline
        name: bandit-baseline
        entry: poetry run python scripts/ci_quality_gate.py bandit
        language: system
        pass_filenames: false
      - id: dependency-audit-baseline
        name: dependency-audit-baseline
        entry: make dependency-audit
        language: system
        pass_filenames: false
      - id: docstr-coverage
        name: docstr-coverage
        entry: poetry run docstr-coverage
        language: system
        args: [tensoraerospace, --skip-magic, --skip-init, --skip-file-doc, --fail-under=70]
        pass_filenames: false

  # Быстрые тесты
  - repo: local
    hooks:
      - id: pytest-quick
        name: pytest-quick
        entry: poetry run pytest
        language: system
        args: [tests/envs/, -x, --maxfail=3, -q]
        pass_filenames: false
        stages: [pre-commit]

# Конфигурация для CI
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip:
    - quality-baseline
    - bandit-baseline
    - dependency-audit-baseline
    - docstr-coverage
    - pytest-quick
  submodules: false
