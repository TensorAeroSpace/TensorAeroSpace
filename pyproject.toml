[tool.poetry]
name = "tensoraerospace"
version = "0.3.16"
description = "Open source deep learning framework that focuses on aerospace objects (rockets, planes, UAVs)"
readme = "readme.md"
authors = ["Artemiy Mazaew (mr8bit)", "Vasily Davydov (dexfrost89)", "Yakov Li (yakovglee)"]
license = "MIT"
packages = [
    { include = "tensoraerospace" },
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo",
    "tensoraerospace/aerospacemodel/**/*.xfl",
    "tensoraerospace/aerospacemodel/**/*.slx",
    "tensoraerospace/aerospacemodel/**/*.slxc",
    "tensoraerospace/aerospacemodel/**/*.m",
    "tensoraerospace/aerospacemodel/**/*.prt",
    "tensoraerospace/aerospacemodel/**/*.xprt",
    "tensoraerospace/aerospacemodel/**/*.exp",
    "tensoraerospace/aerospacemodel/**/*.lib",
    "tensoraerospace/aerospacemodel/**/slprj/**",
    "tensoraerospace/aerospacemodel/**/*_ert_shrlib_rtw/**/*.bat",
    "tensoraerospace/aerospacemodel/**/*_ert_shrlib_rtw/**/*.c",
    "tensoraerospace/aerospacemodel/**/*_ert_shrlib_rtw/**/*.def",
    "tensoraerospace/aerospacemodel/**/*_ert_shrlib_rtw/**/*.dmr",
    "tensoraerospace/aerospacemodel/**/*_ert_shrlib_rtw/**/*.exp",
    "tensoraerospace/aerospacemodel/**/*_ert_shrlib_rtw/**/*.h",
    "tensoraerospace/aerospacemodel/**/*_ert_shrlib_rtw/**/*.lib",
    "tensoraerospace/aerospacemodel/**/*_ert_shrlib_rtw/**/*.mat",
    "tensoraerospace/aerospacemodel/**/*_ert_shrlib_rtw/**/*.mk",
    "tensoraerospace/aerospacemodel/**/*_ert_shrlib_rtw/**/*.obj",
    "tensoraerospace/aerospacemodel/**/*_ert_shrlib_rtw/**/*.rsp",
    "tensoraerospace/aerospacemodel/**/*_ert_shrlib_rtw/**/*.tmw",
    "tensoraerospace/aerospacemodel/**/*_ert_shrlib_rtw/**/modelsources.txt",
]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
optuna = "^3.4.0"
matplotlib = "^3.8.1"
# fonttools is pulled by matplotlib; keep the lower bound above CVE-2025-66034.
fonttools = ">=4.60.2"
pandas = "^2.1.3"
scipy = ">=1.14,<2.0"
moviepy = "^1.0.3"
gymnasium = "^0.29.1"
torch = "^2.2.0"
huggingface-hub = "^0.22.2"
seaborn = "^0.13.2"
plotly = "^6.2.0"
kaleido = ">=0.2.1,<2.0"
pygame = "^2.6.1"
cryptography = {version = ">=45.0.0", python = ">=3.10,<3.14"}
requests = ">=2.33.0"
numpy = ">=1.24.0"
# Pillow is a transitive dep via matplotlib/imageio; pin >=12.2.0 for CVE-2026-40192
# (FITS GZIP decompression bomb, introduced in 10.3.0, fixed in 12.2.0).
pillow = ">=12.2.0"
wandb = ">=0.18,<1.0"
# anywidget is the FigureWidget backend for plotly's "live" render mode
# (per-step in-Jupyter updates). Without it, importing FigureWidget raises
# at runtime (ipywidgets alone is not enough on plotly 6.x).
anywidget = ">=0.9,<1.0"
# tensorboard is a base/core component: the unified metrics writer
# (tensoraerospace.agent.metrics) wraps torch.utils.tensorboard.SummaryWriter,
# and several metrics smoke tests rely on it. Keep it as a default install
# (`poetry install`, `pip install tensoraerospace`) rather than an optional
# extra so the metrics layer works out of the box.
tensorboard = ">=2.15"
ray = {extras = ["tune"], version = "^2.52.0", optional = true}

[tool.poetry.extras]
ray = ["ray"]

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3,<10.0.0"
ruff = ">=0.1.5"
ipykernel = ">=6.26,<8.0"
docstr-coverage = "^2.3.1"
pytest-cov = "^5.0.0"
mypy = "^1.10.0"
black = "^24.10.0"
isort = ">=6.0.1,<9"
flake8 = "^7.3.0"
safety = "^3.0.0"
# Keep marshmallow on 3.x: marshmallow 4 pulls backports-datetime-fromisoformat,
# whose backports/__init__.py conflicts with backports.tarfile and corrupts the
# `backports` namespace, breaking `from backports import zstd` (urllib3 >= 2.7) on
# Python < 3.11. safety only requires marshmallow >= 3.15.0, so 3.x is sufficient.
marshmallow = "<4"
bandit = "^1.7.5"
mkdocs = "^1.6.1"
mkdocs-material = "^9.6.22"
mkdocs-static-i18n = "^1.3.0"
mkdocs-material-extensions = "^1.3.1"
mkdocstrings = { version = ">=0.30.1,<2", extras = ["python"] }
mkdocstrings-python = "^1.18.2"
pymdown-extensions = "^10.7"
mkdocs-autorefs = "^1.4.0"
griffe = ">=1.13,<3.0"
twine = "^6.2.0"
importlib-metadata = "^6.0.0"
mkdocs-glightbox = "^0.5.2"

[tool.poetry.group.test.dependencies]
pytest = ">=9.0.3,<10.0.0"
pytest-cov = "^5.0.0"
pytest-xdist = "^3.0.0"
pytest-mock = "^3.12.0"



[tool.poetry.group.jupyter.dependencies]
jupyter = "^1.0.0"
# jupyter depends on nbconvert with a broad range; keep the lower bound above
# CVE-2025-53000, CVE-2026-39377, and CVE-2026-39378.
nbconvert = ">=7.17.1"
ipykernel = ">=6.29.4,<8.0.0"
qtconsole = "^5.7.0"
jupyter-core = "^5.8.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Конфигурация для black
[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# Конфигурация для isort
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["tensoraerospace"]
known_third_party = ["numpy", "pandas", "matplotlib", "torch", "ray", "optuna"]

# Конфигурация для pytest
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
cache_dir = "/tmp/tensoraerospace_pytest_cache"
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
# Silence noise that is not actionable for this project right now:
#   - Gymnasium v1.0 wrapper-attribute deprecation: every direct
#     `env.<custom_attr>` access through a wrapper warns. Migrating to
#     `env.get_wrapper_attr(...)` everywhere is a separate, repo-wide effort.
#   - Gymnasium passive-env-checker UserWarnings about non-strictly-compliant
#     reward/obs types from third-party envs (e.g. Pendulum-v1 used in smoke
#     tests). These are env-side cosmetics, not test failures.
filterwarnings = [
    "ignore:.*to get variables from other wrappers is deprecated.*:UserWarning",
    "ignore:.*The reward returned by.*:UserWarning",
    "ignore:.*The obs returned by the.*:UserWarning",
]

# Конфигурация для coverage
[tool.coverage.run]
source = ["tensoraerospace"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__init__.py",
    "*/setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Конфигурация для mypy
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "matplotlib.*",
    "pandas.*",
    "scipy.*",
    "torch.*",
    "ray.*",
    "optuna.*",
    "gymnasium.*",
    "huggingface_hub",
    "huggingface_hub.*",
    "IPython",
    "IPython.*",
    "moviepy.*",
    "mlagents_envs.*",
    "plotly.*",
    "tqdm",
    "tqdm.*",
    "wandb",
    "wandb.*",
    "yaml",
]
ignore_missing_imports = true

# Конфигурация для bandit
[tool.bandit]
exclude_dirs = ["tests", "docs"]
skips = ["B101", "B601"]
